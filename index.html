<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulación Interactiva 3D del Sistema Solar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Interfaz de Usuario UI */
        .ui-panel {
            position: absolute;
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 15px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        #controls-panel {
            top: 20px;
            left: 20px;
            width: 280px;
        }
        h1 {
            font-size: 1.2rem;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4af;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .control-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #aaa;
        }
        .btn {
            background: #222533;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            margin-right: 5px;
            margin-bottom: 5px;
            font-size: 0.8rem;
        }
        .btn:hover {
            background: #3a3f55;
            border-color: #4af;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-active {
            background: #4af;
            color: #000;
            border-color: #4af;
        }
        /* Panel de Información Lateral */
        #info-panel {
            top: 20px;
            right: -350px;
            width: 320px;
            max-height: 85vh;
            overflow-y: auto;
            transition: right 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #info-panel.open {
            right: 20px;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 1.2rem;
            color: #aaa;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #ff4a4a;
        }
        #info-title {
            font-size: 1.5rem;
            color: #fff;
            margin-bottom: 10px;
        }
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        .data-table tr {
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .data-table td {
            padding: 8px 4px;
        }
        .data-label {
            color: #8af;
            font-weight: 500;
            width: 45%;
        }
        /* Instrucciones en pantalla */
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            pointer-events: none;
            color: #ccc;
            text-align: center;
        }
        /* Estilos de las etiquetas 2D sobre los planetas */
        .planet-label {
            position: absolute;
            z-index: 1;
            transform: translate(-50%, -100%);
            color: white;
            font-family: sans-serif;
            font-size: 11px;
            padding: 2px 6px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="labels-container"></div>

    <div class="ui-panel" id="controls-panel">
        <h1>Sistema Solar 3D</h1>
        <div class="control-group">
            <label>Controles de Tiempo</label>
            <button class="btn" id="btn-pause">Pausar</button>
            <button class="btn" id="btn-slow">Velocidad -</button>
            <button class="btn" id="btn-fast">Velocidad +</button>
        </div>
        <div class="control-group">
            <label>Visualización</label>
            <button class="btn btn-active" id="btn-orbits">Órbitas: ON</button>
            <button class="btn btn-active" id="btn-axes">Ejes: ON</button>
        </div>
        <div style="font-size:0.75rem; color:#777; margin-top:10px;">
            Haz clic sobre un planeta para examinar sus datos científicos.
        </div>
    </div>

    <div class="ui-panel" id="info-panel">
        <span class="close-btn" id="btn-close-info">&times;</span>
        <h2 id="info-title">Planeta</h2>
        <table class="data-table">
            <tr>
                <td class="data-label">Radio Ecuatorial:</td>
                <td id="data-radius">-</td>
            </tr>
            <tr>
                <td class="data-label">Gravedad:</td>
                <td id="data-gravity">-</td>
            </tr>
            <tr>
                <td class="data-label">Período Rotación:</td>
                <td id="data-rotation">-</td>
            </tr>
            <tr>
                <td class="data-label">Período Traslación:</td>
                <td id="data-orbit">-</td>
            </tr>
            <tr>
                <td class="data-label">Atmósfera Principal:</td>
                <td id="data-atmosphere">-</td>
            </tr>
        </table>
    </div>

    <div id="instructions">Arrastra para rotar | Rueda para Zoom | Clic derecho para desplazar</div>

    <script>
        // --- DATOS CIENTÍFICOS DE LOS ASTROS ---
        const planetData = {
            "Sol": { radius: "696,340 km", gravity: "274 m/s²", rotation: "25-35 días", orbit: "Centro", atmosphere: "Hidrógeno (73%), Helio (25%)" },
            "Mercurio": { radius: "2,439 km", gravity: "3.7 m/s²", rotation: "58.6 días", orbit: "88 días", atmosphere: "Exosfera tenue (Oxígeno, Sodio, Helio)" },
            "Venus": { radius: "6,051 km", gravity: "8.87 m/s²", rotation: "243 días (retrógrado)", orbit: "224.7 días", atmosphere: "Dióxido de Carbono (96.5%), Nitrógeno (3.5%)" },
            "Tierra": { radius: "6,371 km", gravity: "9.81 m/s²", rotation: "23h 56m", orbit: "365.25 días", atmosphere: "Nitrógeno (78%), Oxígeno (21%), Argón (0.9%)" },
            "Marte": { radius: "3,389 km", gravity: "3.71 m/s²", rotation: "24h 37m", orbit: "687 días", atmosphere: "Dióxido de Carbono (95%), Nitrógeno (2.8%)" },
            "Júpiter": { radius: "69,911 km", gravity: "24.79 m/s²", rotation: "9h 55m", orbit: "11.86 años", atmosphere: "Hidrógeno (89.8%), Helio (10.2%)" },
            "Saturno": { radius: "58,232 km", gravity: "10.44 m/s²", rotation: "10h 33m", orbit: "29.45 años", atmosphere: "Hidrógeno (96.3%), Helio (3.2%)" },
            "Urano": { radius: "25,362 km", gravity: "8.69 m/s²", rotation: "17h 14m (retrógrado)", orbit: "84 años", atmosphere: "Hidrógeno (82.5%), Helio (15.2%), Metano (2.3%)" },
            "Neptuno": { radius: "24,622 km", gravity: "11.15 m/s²", rotation: "16h 06m", orbit: "164.8 años", atmosphere: "Hidrógeno (80%), Helio (19%), Metano (1.5%)" }
        };

        // --- CONFIGURACIÓN VISUAL DEL MAPA DE TRES DIMENSIONES ---
        const scaleConfig = [
            { name: "Sol",      size: 6.0, dist: 0,   speed: 0,       color: 0xffaa00, tilt: 7.25 },
            { name: "Mercurio", size: 0.6, dist: 12,  speed: 0.03,    color: 0x888888, tilt: 0.034 },
            { name: "Venus",    size: 1.1, dist: 17,  speed: 0.02,    color: 0xe3bb76, tilt: 177.3 },
            { name: "Tierra",   size: 1.2, dist: 23,  speed: 0.015,   color: 0x2b82c9, tilt: 23.44 },
            { name: "Marte",    size: 0.8, dist: 29,  speed: 0.012,   color: 0xc1440e, tilt: 25.19 },
            { name: "Júpiter",  size: 3.0, dist: 40,  speed: 0.006,   color: 0xbfa78f, tilt: 3.13 },
            { name: "Saturno",  size: 2.5, dist: 54,  speed: 0.004,   color: 0xe2bf7d, tilt: 26.73, hasRings: true },
            { name: "Urano",    size: 1.8, dist: 68,  speed: 0.002,   color: 0x4b70dd, tilt: 97.77 },
            { name: "Neptuno",  size: 1.7, dist: 78,  speed: 0.001,   color: 0x274687, tilt: 28.32 }
        ];

        // --- VARIABLES GLOBALES ---
        let scene, camera, renderer, controls;
        let planets = [];
        let orbitLines = [];
        let axisLines = [];
        let asteroidBelt;
        let timeMultiplier = 1.0;
        let isPaused = false;
        let showOrbits = true;
        let showAxes = true;
        
        const labelsContainer = document.getElementById('labels-container');
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- INICIALIZACIÓN ---
        function init() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 55, 95);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxDistance = 300;
            controls.minDistance = 5;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0x333333); 
            scene.add(ambientLight);

            const sunLight = new THREE.PointLight(0xffffff, 2, 300); 
            scene.add(sunLight);

            createStars();
            createSolarSystem();
            createAsteroidBelt(33, 36, 500);

            window.addEventListener('resize', onWindowResize);
            window.addEventListener('click', onPlanetClick);

            setupUI();
            animate();
        }

        // --- FONDO DE ESTRELLAS ---
        function createStars() {
            const starGeometry = new THREE.BufferGeometry();
            const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5 });
            const starVertices = [];
            for (let i = 0; i < 2000; i++) {
                const x = (Math.random() - 0.5) * 600;
                const y = (Math.random() - 0.5) * 600;
                const z = (Math.random() - 0.5) * 600;
                if(Math.sqrt(x*x + y*y + z*z) > 90) {
                    starVertices.push(x, y, z);
                }
            }
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);
        }

        // --- CREACIÓN DE PLANETAS ---
        function createSolarSystem() {
            scaleConfig.forEach((cfg) => {
                // Grupo principal que contendrá al cuerpo celeste e irá trasladándose por la escena
                const planetGroup = new THREE.Group();
                scene.add(planetGroup);

                let mat;
                if (cfg.name === "Sol") {
                    mat = new THREE.MeshBasicMaterial({ color: cfg.color });
                } else {
                    mat = new THREE.MeshStandardMaterial({ color: cfg.color, roughness: 0.8, metalness: 0.1 });
                }

                const geom = new THREE.SphereGeometry(cfg.size, 32, 32);
                
                // Malla interna (mesh) para controlar la rotación intrínseca sobre sí mismo
                const mesh = new THREE.Mesh(geom, mat);
                mesh.name = cfg.name; 
                planetGroup.add(mesh);

                // Aplicar inclinación del eje de rotación real al grupo planetario
                const tiltRad = (cfg.tilt * Math.PI) / 180;
                mesh.rotation.z = tiltRad;

                // Dibujar línea del Eje de rotación
                const axisGeom = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(0, -cfg.size * 1.6, 0),
                    new THREE.Vector3(0, cfg.size * 1.6, 0)
                ]);
                const axisMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.4 });
                const axisLine = new THREE.Line(axisGeom, axisMat);
                // El eje se inclina junto con el cuerpo
                mesh.add(axisLine);
                axisLines.push(axisLine);

                // Configurar posición inicial calculada matemáticamente en el plano XZ
                const initialAngle = Math.random() * Math.PI * 2;
                planetGroup.position.x = Math.cos(initialAngle) * cfg.dist;
                planetGroup.position.z = Math.sin(initialAngle) * cfg.dist;

                // Anillos de Saturno
                if (cfg.hasRings) {
                    const ringGeom = new THREE.RingGeometry(cfg.size * 1.4, cfg.size * 2.3, 64);
                    ringGeom.rotateX(Math.PI / 2); 
                    const ringMat = new THREE.MeshStandardMaterial({ color: 0xa69575, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                    const ringMesh = new THREE.Mesh(ringGeom, ringMat);
                    mesh.add(ringMesh); // Se añade a la malla para que rote inclinado
                }

                // Satélite Luna (Tierra)
                if (cfg.name === "Tierra") {
                    const moonGeom = new THREE.SphereGeometry(0.25, 16, 16);
                    const moonMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
                    const moonMesh = new THREE.Mesh(moonGeom, moonMat);
                    moonMesh.position.x = 2.2; 
                    planetGroup.add(moonMesh); // Añadido al grupo para que orbite la Tierra pero no rote sobre el eje terrestre
                    planetGroup.userData = { moon: moonMesh, moonAngle: 0 };
                }

                // Trazado visible de la Órbita circular en el plano horizontal (XZ)
                if (cfg.dist > 0) {
                    const orbitGeom = new THREE.BufferGeometry();
                    const points = [];
                    for (let i = 0; i <= 128; i++) {
                        const theta = (i / 128) * Math.PI * 2;
                        points.push(new THREE.Vector3(Math.cos(theta) * cfg.dist, 0, Math.sin(theta) * cfg.dist));
                    }
                    orbitGeom.setFromPoints(points);
                    const orbitMat = new THREE.LineBasicMaterial({ color: 0x444455, transparent: true, opacity: 0.6 });
                    const orbitLine = new THREE.Line(orbitGeom, orbitMat);
                    scene.add(orbitLine);
                    orbitLines.push(orbitLine);
                }

                // Crear etiqueta de texto flotante en HTML
                const label = document.createElement('div');
                label.className = 'planet-label';
                label.textContent = cfg.name;
                labelsContainer.appendChild(label);

                // Guardar objeto estructurado de control
                planets.push({
                    name: cfg.name,
                    group: planetGroup,
                    mesh: mesh,
                    speed: cfg.speed,
                    dist: cfg.dist,
                    labelElement: label,
                    angle: initialAngle
                });
            });
        }

        // --- CINTURÓN DE ASTEROIDES ---
        function createAsteroidBelt(minRadius, maxRadius, count) {
            asteroidBelt = new THREE.Group();
            for (let i = 0; i < count; i++) {
                const radius = minRadius + Math.random() * (maxRadius - minRadius);
                const angle = Math.random() * Math.PI * 2;
                const x = Math.cos(angle) * radius;
                const y = (Math.random() - 0.5) * 0.4;
                const z = Math.sin(angle) * radius;

                const size = 0.04 + Math.random() * 0.1;
                const geom = new THREE.SphereGeometry(size, 4, 4);
                const mat = new THREE.MeshStandardMaterial({ color: 0x666666 });
                const mesh = new THREE.Mesh(geom, mat);
                mesh.position.set(x, y, z);
                asteroidBelt.add(mesh);
            }
            scene.add(asteroidBelt);
        }

        // --- BUCLE DE RENDERIZADO Y ANIMACIÓN ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isPaused) {
                planets.forEach(p => {
                    if (p.dist > 0) {
                        // CORRECCIÓN: Actualizar el ángulo y re-posicionar los planetas sobre sus órbitas reales
                        p.angle += p.speed * 0.2 * timeMultiplier;
                        p.group.position.x = Math.cos(p.angle) * p.dist;
                        p.group.position.z = Math.sin(p.angle) * p.dist;
                    }

                    // Rotación intrínseca sobre su propio eje (Eje Y local)
                    const rotSpeed = p.name === "Sol" ? 0.002 : 0.02;
                    p.mesh.rotation.y += rotSpeed * timeMultiplier;

                    // Animación de la Luna alrededor de la Tierra
                    if (p.name === "Tierra" && p.group.userData.moon) {
                        let uData = p.group.userData;
                        uData.moonAngle += 0.05 * timeMultiplier;
                        uData.moon.position.x = Math.cos(uData.moonAngle) * 2.2;
                        uData.moon.position.z = Math.sin(uData.moonAngle) * 2.2;
                    }
                });

                if (asteroidBelt) {
                    asteroidBelt.rotation.y += 0.0003 * timeMultiplier;
                }
            }

            controls.update();
            updateLabels();
            renderer.render(scene, camera);
        }

        // --- PROYECCIÓN DE ETIQUETAS EN PANTALLA ---
        function updateLabels() {
            const tempV = new THREE.Vector3();
            planets.forEach(p => {
                p.mesh.getWorldPosition(tempV); // Obtiene la posición absoluta en tiempo real
                tempV.project(camera);

                if (tempV.z > 1) {
                    p.labelElement.style.display = 'none';
                    return;
                } else {
                    p.labelElement.style.display = 'block';
                }

                const x = (tempV.x * .5 + .5) * window.innerWidth;
                const y = (tempV.y * -.5 + .5) * window.innerHeight;

                p.labelElement.style.transform = `translate(-50%, -25px)`;
                p.labelElement.style.left = `${x}px`;
                p.labelElement.style.top = `${y}px`;
            });
        }

        // --- GESTIÓN DE CLICS ---
        function onPlanetClick(event) {
            if (event.target.tagName === 'BUTTON' || event.target.closest('.ui-panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const meshesToIntersect = planets.map(p => p.mesh);
            const intersects = raycaster.intersectObjects(meshesToIntersect);

            if (intersects.length > 0) {
                showPlanetInfo(intersects[0].object.name);
            }
        }

        function showPlanetInfo(name) {
            const data = planetData[name];
            if (!data) return;

            document.getElementById('info-title').textContent = name;
            document.getElementById('data-radius').textContent = data.radius;
            document.getElementById('data-gravity').textContent = data.gravity;
            document.getElementById('data-rotation').textContent = data.rotation;
            document.getElementById('data-orbit').textContent = data.orbit;
            document.getElementById('data-atmosphere').textContent = data.atmosphere;

            document.getElementById('info-panel').classList.add('open');
        }

        // --- INTERFAZ DE USUARIO ---
        function setupUI() {
            document.getElementById('btn-close-info').addEventListener('click', () => {
                document.getElementById('info-panel').classList.remove('open');
            });

            const pauseBtn = document.getElementById('btn-pause');
            pauseBtn.addEventListener('click', () => {
                isPaused = !isPaused;
                pauseBtn.textContent = isPaused ? "Reanudar" : "Pausar";
                pauseBtn.classList.toggle('btn-active', isPaused);
            });

            document.getElementById('btn-slow').addEventListener('click', () => {
                timeMultiplier = Math.max(0.1, timeMultiplier - 0.3);
            });
            document.getElementById('btn-fast').addEventListener('click', () => {
                timeMultiplier = Math.min(7.0, timeMultiplier + 0.5);
            });

            const orbitsBtn = document.getElementById('btn-orbits');
            orbitsBtn.addEventListener('click', () => {
                showOrbits = !showOrbits;
                orbitLines.forEach(line => line.visible = showOrbits);
                orbitsBtn.textContent = `Órbitas: ${showOrbits ? "ON" : "OFF"}`;
                orbitsBtn.classList.toggle('btn-active', showOrbits);
            });

            const axesBtn = document.getElementById('btn-axes');
            axesBtn.addEventListener('click', () => {
                showAxes = !showAxes;
                axisLines.forEach(line => line.visible = showAxes);
                axesBtn.textContent = `Ejes: ${showAxes ? "ON" : "OFF"}`;
                axesBtn.classList.toggle('btn-active', showAxes);
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.onload = init;
    </script>
</body>
</html>
